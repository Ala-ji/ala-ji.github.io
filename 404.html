<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable · Gora Ndoye</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      // Toute écriture de /portfolio (portfolio, PORTFOLIO, portfolio/…) mène à l'accueil
      var p = location.pathname.toLowerCase().replace(/\/+$/, '');
      if (p === '/portfolio' || p.indexOf('/portfolio/') === 0) {
        location.replace('/' + location.hash);
        return;
      }
      // Sinon, page introuvable au thème du site (comme sur l'accueil)
      var root = document.documentElement, t = null;
      root.classList.add('js');
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .introuvable { display: grid; align-content: center; min-height: 100vh; min-height: 100svh; padding-block: 64px; }
    .introuvable h1 { margin-bottom: 16px; font-family: var(--font-display); font-size: clamp(2.25rem, 6vw, 3.5rem); line-height: 1.1; letter-spacing: -0.02em; }
    .introuvable .section-intro { max-width: 36rem; margin: 0 0 32px; }
  </style>
</head>
<body>
  <main class="wrap introuvable">
    <h1>Cette page n’existe pas</h1>
    <p class="section-intro">L’adresse est peut-être mal saisie, ou la page a été déplacée. Tout le travail de Gora Ndoye est sur la page d’accueil.</p>
    <p><a class="btn btn-primary" href="/">Revenir au portfolio <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a></p>
  </main>
</body>
</html>
